[package]
name = "integration-tests"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# This crate exists to host cross-crate end-to-end tests. `src/lib.rs` is the
# harness those tests share — fixture images and a thin set of helpers that
# build commands for `app_shell::doc::OpenDocument`, which is the engine the
# application itself runs. The tests themselves live in `tests/`.
[lib]
path = "src/lib.rs"

# Regular dependencies rather than dev-dependencies, because these seven are the
# ones the harness in `src/lib.rs` itself names — in the signatures of
# `app::DocExt` and `fixture` — and a dev-dependency is not visible to the
# library target. Everything only the `tests/` targets reach for is a
# dev-dependency below.
[dependencies]
# The application's own engine. `OpenDocument` and `session` carry no window and
# no GPU handle, so the end-to-end tests drive the real thing rather than a
# look-alike. This dependency is the whole point of the suite: a test that
# builds its own document/history/tile-store triple proves that triple works,
# not that the product does.
app-shell.workspace = true
editor-core.workspace = true
layer-model.workspace = true
compositor.workspace = true
raster.workspace = true
tools.workspace = true
# The deterministic composition fixtures (`fixture::thumbnail`) assemble the
# acceptance scene's text layers and set an affine transform, so both of these
# join the library dependencies. Both are already in the lockfile graph.
glam.workspace = true
dejavu = "2.37"
color.workspace = true
# Task 004's shell-route helpers drive the real `app_shell::Editor` through the
# real `ui` routes (menu resolution, tool options, property focus), so `ui`
# joins the library dependencies; `text-engine` names the `TextRun` the
# Character panel commits through. Both are already in the lockfile graph.
ui.workspace = true

# Used only by the test targets in `tests/`, which see dev-dependencies.
[dev-dependencies]
# `the_character_panel_edits_reach_the_pixels_undo_and_reopen` builds the
# swatch the Colour picker would hand the panel, in egui's own type.
egui.workspace = true
# The font-selection test installs the app's real UI typefaces through
# `app_shell::chrome::install_theme` before measuring them.
design.workspace = true
project-format.workspace = true
psd.workspace = true
selection.workspace = true
filters.workspace = true
text-engine.workspace = true
glam.workspace = true
tempfile = "3"

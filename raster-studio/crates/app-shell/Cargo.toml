[package]
name = "app-shell"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
glam.workspace = true
winit.workspace = true
wgpu.workspace = true
pollster.workspace = true
render.workspace = true
asset-store.workspace = true
editor-core.workspace = true
layer-model.workspace = true
telemetry.workspace = true
webbrowser.workspace = true
compositor.workspace = true
project-format.workspace = true
raster.workspace = true
# Photoshop documents. `psd` models a `.psd` as its own tree of planar channels
# and deliberately owns no conversion into this application's tile/layer model —
# that conversion is `crate::import`'s job, which is why the dependency lands
# here and not in `raster` (whose codec facade moves flat images only).
psd.workspace = true
tools.workspace = true
# The engines behind the Filter, Image ▸ Adjustments and Select menus. The
# shell reaches them through `menu_bridge::perform`, which is what makes those
# menus do something; before this wave every one of those items was drawn
# disabled because nothing in the shell could call these crates at all.
filters.workspace = true
adjustments.workspace = true
selection.workspace = true
color.workspace = true
design.workspace = true
ui.workspace = true
egui.workspace = true
egui-winit.workspace = true
egui-wgpu.workspace = true
serde.workspace = true
serde_json.workspace = true
rmp-serde.workspace = true
rfd = "0.15"
dirs = "5"

# Asking the OS whether a recorded process id is still alive, which is what
# tells a crashed run's session marker apart from a second running instance's.
# See `session::process_is_running`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# Test-only: `the_mask_covers_every_component_the_panel_lists` names every
# colour space so the channel mask cannot silently outgrow its three bools.
color.workspace = true
# Test-only: `a_pen_click_sequence_builds_the_expected_path` reads the SVG the
# Pen tool wrote back into a `vector::Path`, so the assertion is about the
# geometry the clicks describe rather than about a formatted string.
vector.workspace = true

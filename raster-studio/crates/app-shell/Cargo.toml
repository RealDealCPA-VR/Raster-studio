[package]
name = "app-shell"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
glam.workspace = true
winit.workspace = true
wgpu.workspace = true
pollster.workspace = true
render.workspace = true
editor-core.workspace = true
layer-model.workspace = true
compositor.workspace = true
project-format.workspace = true
raster.workspace = true
tools.workspace = true
design.workspace = true
ui.workspace = true
egui.workspace = true
egui-winit.workspace = true
egui-wgpu.workspace = true
serde.workspace = true
serde_json.workspace = true
rmp-serde.workspace = true
rfd = "0.15"
dirs = "5"

# Asking the OS whether a recorded process id is still alive, which is what
# tells a crashed run's session marker apart from a second running instance's.
# See `session::process_is_running`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[package]
name = "editor-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
glam.workspace = true
color.workspace = true
layer-model.workspace = true
# Tile vocabulary: `TileCoord`, `TileHash`, `PixelRect`, `TILE_SIZE`, and
# `Tile`/`PixelFormat` (used to derive a solid tile's hash). Commands reference
# pixels by content hash, and the hash has to be the same one the tile store
# computes, so the types are imported rather than redeclared.
raster.workspace = true

[dev-dependencies]
serde_json.workspace = true
# The encoder `project-format` saves with. `Document`'s hand-written `Serialize`
# omits empty fields, so it needs a name-keyed encoding; the round-trip test
# holds that contract against the real MessagePack implementation rather than
# against `serde_json` alone.
rmp-serde.workspace = true

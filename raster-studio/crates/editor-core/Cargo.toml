# Tile vocabulary: `TileCoord`, `TileHash`, `PixelRect`, `TILE_SIZE`, and
# `Tile`/`PixelFormat` (used to derive a solid tile's hash). Commands reference
# pixels by content hash, and the hash has to be the same one the tile store
# computes, so the types are imported rather than redeclared.
raster.workspace = true


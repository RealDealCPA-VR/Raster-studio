[package]
name = "compositor"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
# No `serde` on purpose: nothing in this crate is persisted. A composite is
# derived from the document and the tile store, so it is recomputed rather than
# saved, and the only serializable things it touches (`Document`, `LayerTree`)
# are serialized by the crates that own them.
rayon.workspace = true
glam.workspace = true
color.workspace = true
raster.workspace = true
layer-model.workspace = true
editor-core.workspace = true
# The parametric adjustments. `adjust.rs` still evaluates the five adjustment
# kinds that predate that crate itself; everything else is delegated to it.
adjustments.workspace = true
# The three rasterizers the compositor drives rather than reimplements: glyph
# coverage for a text layer, path coverage for a shape layer, and the Gaussian
# that gives a shadow or a glow its falloff.
text-engine.workspace = true
vector.workspace = true
filters.workspace = true

[dev-dependencies]
# A deterministic font for the text-layer tests, so what composites does not
# depend on what the machine happens to have installed.
dejavu = "2.37"

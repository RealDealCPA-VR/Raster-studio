[package]
name = "raster"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# W15-E: PostScript `search` finds a substring in place in constant extra
# space (MIT OR Unlicense; already in the graph through `regex`/`image`).
memchr = "2.7"
thiserror.workspace = true
serde.workspace = true
blake3.workspace = true
# The workspace pins png/jpeg/webp/tiff. The import pipeline additionally reads
# GIF, BMP, ICO and TGA, and exports GIF and BMP, so those codec features are
# requested here.
#
# Requesting them *here* is not containment: Cargo unifies features across a
# workspace build, so `image` is compiled once with the union of every member's
# requests and these four decoders are linked into every crate in the workspace
# that depends on `image`, whatever its own manifest asks for. Treat this list
# as workspace-wide attack surface, not as this crate's private set.
image = { workspace = true, features = ["gif", "bmp", "ico", "tga", "avif", "exr", "hdr"] }
# W11-H: `exr` pulls in the pure-Rust `exr` crate (BSD-3-Clause; it forbids
# unsafe itself but depends on `pulp`, a SIMD-dispatch crate that uses it;
# `image` takes it with default features off, so no rayon pool); `hdr`
# is `image`'s own Radiance RGBE codec (no extra dependency). Both are driven
# by `src/formats/float.rs`, not by `image`'s content sniff. `exr` is also
# named directly (the same crate `image` links, default features off) so the
# header can be read and bounded before `image` decodes a block.
exr = { version = "1.74", default-features = false }
# W10-F: `avif` above is the AVIF *encoder* only: `image` wires it to `ravif`
# (BSD-3-Clause) over `rav1e` (BSD-2-Clause), both pure Rust, and `image`
# itself turns off ravif's `asm` feature (nasm). There is no AVIF *decoder*:
# `rav1d` was tried and aborts the process on a damaged file (see
# `src/formats/avif.rs`), and `image`'s `avif-native` binds libdav1d (C).
# W10-F: JPEG XL decoding, pure Rust (MIT OR Apache-2.0); default features
# off, so no rayon thread pool and no C colour engine (lcms2).
jxl-oxide = { version = "0.12", default-features = false }
# W11-H: JPEG XL *encoding*: lossless modular only, pure Rust with no unsafe
# code (MIT OR Apache-2.0 OR Zlib). `threads` off: one thread, no pool. What
# it writes is read back by `jxl-oxide` above. `zune-core` (same licence) is
# its options/colour-space vocabulary, already in the tree through `image`.
zune-jpegxl = { version = "0.5", default-features = false, features = ["std"] }
zune-core = "0.5"
# W13-L: MP4 video export (`ExportFormat::Mp4`, `src/formats/mp4.rs`): the AV1
# encoder `rav1e` (BSD-2-Clause, pure Rust), the same 0.8.1 already in the
# tree behind `image`'s AVIF writer, named directly with default features off:
# no `asm` (nasm), no `threading` (rayon pool). No new crate enters the lock
# file. The MP4 container is written by hand in `mp4.rs` (no muxer crate).
rav1e = { version = "0.8.1", default-features = false }
# W15-B: H.264 for MP4 export (the default codec; AV1 above stays an
# option), through `openh264` 0.9.8 (BSD-2-Clause, Rust bindings) over
# Cisco's OpenH264 *source* (BSD-2-Clause), which `openh264-sys2`'s `source`
# feature compiles with the `cc` crate (a C++ compiler at build time: MSVC,
# gcc or clang, as the three CI runners have). Cisco's prebuilt binary and
# its runtime download (`libloading` feature) are not used. The x86 assembly
# is assembled only when `nasm` is on PATH; without it the build falls back
# to the plain C++ kernels. rust-version 1.85 (under the workspace MSRV).
# Recorded in LICENSES/THIRD_PARTY_NOTICES.md.
openh264 = { version = "0.9.8", default-features = false, features = ["source"] }
# W11-H: lossy WebP export (`ExportFormat::WebPLossy`): one VP8 key frame,
# exact alpha in an uncompressed `ALPH` chunk. Pure Rust, `#![forbid(unsafe_code)]`,
# `no_std` + `alloc`, no dependencies with default features off (the `cli`
# feature's PNG/JPEG readers are not wanted), MIT OR Apache-2.0, rust-version
# 1.85 (under the workspace MSRV). Chosen over `gamut-webp` 0.3.1 (MSRV 1.92)
# and `webpkit` 0.1.0 (MSRV 1.96), which would raise the workspace MSRV, and
# over `vaam-image-webp` 0.1.0, which measured 7-13 dB PSNR on small images;
# the measurements are in docs/parity-matrix.md.
tiny-webp = { version = "0.1.0", default-features = false, features = ["std"] }
color.workspace = true
# Reinterpreting `&[u16]` as `&[u8]` for 16-bit encoders, without a copy.
bytemuck.workspace = true
flate2.workspace = true
# W9-N: File > Open rasterises an .svg through resvg (pure Rust,
# Apache-2.0 OR MIT; recorded in LICENSES/THIRD_PARTY_NOTICES.md). No
# `memmap-fonts` (no unsafe mmap of system font files). resvg has no switch
# for svgz: usvg's `Tree::from_data` always inflates gzip, unbounded, so
# `svg_import` inflates through a capped reader and calls `from_str` only.
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "raster-images"] }
# W13-D: File > Open renders PDF (and PDF-compatible .ai) pages through
# hayro (pure Rust, `#![forbid(unsafe_code)]` in the crate itself,
# Apache-2.0; its rasteriser `vello_cpu` and helpers are Apache-2.0 OR MIT;
# the embedded standard-14 fonts are PDFium's Foxit fonts, BSD-3-Clause).
# Pinned to 0.4: 0.5's `hayro-syntax` turns on flate2's `zlib-rs` backend,
# which Cargo's feature unification would swap in for every flate2 user in
# the workspace (it changed this crate's own compressed output: the XCF
# fixture tests went red), and 0.6+ needs rustc 1.92 (MSRV is 1.89). 0.4
# keeps flate2's `rust_backend`; its optional OpenJPEG (C) `jpeg2000`
# feature stays off, so JPEG 2000 images inside a PDF are not drawn.
# Recorded in LICENSES/THIRD_PARTY_NOTICES.md.
hayro = "=0.4.0"
# The same crate hayro reads with, named for its `LoadPdfError`.
hayro-syntax = "=0.4.0"
# W13X-8: a Figma `.fig` canvas (fig-kiwi) compresses its chunks with
# Zstandard in newer files (raw DEFLATE in older ones, through flate2).
# ruzstd is a pure-Rust Zstandard *decoder*, MIT. Default features off: no
# `hash` (twox-hash, frame checksums are not verified) and no dict builder,
# so it brings no dependency of its own. Output is read through a capped
# reader (`src/formats/design_fig.rs`). Recorded in
# LICENSES/THIRD_PARTY_NOTICES.md.
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
# W15-A: AVIF and HEIC *reading*, which the application runs only inside
# its decode worker process (`app-shell`'s `decode_worker`: the editor
# re-executes itself with `--decode-worker`), because both decoders can
# panic on a damaged file and the release profile is `panic = "abort"`.
# `src/formats/heif.rs` holds the in-process decode the worker calls.
# - `rusty_av1d` 1.2.0 (BSD-2-Clause): a rav1d (pure-Rust dav1d port) fork
#   with a Rust API. Default features off: no `asm` (nasm); 8-bit and
#   10/12-bit decoding kept. rust-version 1.79.
# - `heic-rs` 0.1.1 (MIT OR Apache-2.0): a pure-Rust, `forbid(unsafe_code)`
#   HEIF container reader and HEVC still-picture decoder; its container
#   parser also reads the AVIF item structure. Default features off: no
#   rayon pool. rust-version 1.85.
# Recorded in LICENSES/THIRD_PARTY_NOTICES.md.
rusty_av1d = { version = "1.2.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
heic-rs = { version = "0.1.1", default-features = false, features = ["std"] }

[dev-dependencies]
# W15-A (test only): `heic-rs`'s `bench` feature exposes its synthetic HEVC
# bitstream builder (`hevc::synth`), the only HEVC encoder in reach, which
# the HEIC tests wrap in a hand-written HEIF container. `ravif` (the same
# 0.13 `image` already links) writes the 10-bit AVIF fixtures `image`'s
# 8-bit-only encoder cannot.
heic-rs = { version = "0.1.1", default-features = false, features = ["std", "bench"] }
ravif = { version = "0.13", default-features = false }

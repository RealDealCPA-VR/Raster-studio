[package]
name = "raster"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
blake3.workspace = true
# The workspace pins png/jpeg/webp/tiff. The import pipeline additionally reads
# GIF, BMP, ICO and TGA, and exports GIF and BMP, so those codec features are
# requested here.
#
# Requesting them *here* is not containment: Cargo unifies features across a
# workspace build, so `image` is compiled once with the union of every member's
# requests and these four decoders are linked into every crate in the workspace
# that depends on `image`, whatever its own manifest asks for. Treat this list
# as workspace-wide attack surface, not as this crate's private set.
image = { workspace = true, features = ["gif", "bmp", "ico", "tga", "avif"] }
# W10-F: `avif` above is the AVIF *encoder* only: `image` wires it to `ravif`
# (BSD-3-Clause) over `rav1e` (BSD-2-Clause), both pure Rust, and `image`
# itself turns off ravif's `asm` feature (nasm). There is no AVIF *decoder*:
# `rav1d` was tried and aborts the process on a damaged file (see
# `src/formats/avif.rs`), and `image`'s `avif-native` binds libdav1d (C).
# W10-F: JPEG XL decoding, pure Rust (MIT OR Apache-2.0); default features
# off, so no rayon thread pool and no C colour engine (lcms2).
jxl-oxide = { version = "0.12", default-features = false }
color.workspace = true
# Reinterpreting `&[u16]` as `&[u8]` for 16-bit encoders, without a copy.
bytemuck.workspace = true
flate2.workspace = true
# W9-N: File > Open rasterises an .svg through resvg (pure Rust,
# Apache-2.0 OR MIT; recorded in LICENSES/THIRD_PARTY_NOTICES.md). No
# `memmap-fonts` (no unsafe mmap of system font files). resvg has no switch
# for svgz: usvg's `Tree::from_data` always inflates gzip, unbounded, so
# `svg_import` inflates through a capped reader and calls `from_str` only.
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "raster-images"] }

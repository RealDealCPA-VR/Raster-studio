[package]
name = "text-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
layer-model.workspace = true

# Shaping / font handling. `std` gives us memory-mapped system font loading and
# `swash` gives us the glyph rasteriser. `fontconfig` is deliberately off: it is
# a Linux-only discovery path we do not need (fontdb's own scanner covers all
# three desktop platforms) and it drags in extra native lookups.
cosmic-text = { version = "0.17", default-features = false, features = ["std", "swash"] }
# W16-L: WOFF / WOFF2 fonts (File > Open of a `.woff` / `.woff2`) are
# unwrapped to sfnt by `wuff` 0.2.9 (MIT, pure Rust, rust-version 1.85):
# WOFF 1 through `flate2` (already in the tree), WOFF 2 through
# `brotli-decompressor` 5.0.3 (BSD-3-Clause OR MIT, already in the tree)
# plus `bytes` (MIT, already in the tree). Recorded in
# LICENSES/THIRD_PARTY_NOTICES.md.
wuff = { version = "0.2.9", default-features = false, features = ["brotli", "z"] }

[dev-dependencies]
serde_json.workspace = true
# Deterministic test corpus: an embedded, permissively licensed font family so
# the shaping/layout/raster assertions do not depend on whatever the host
# machine happens to have installed.
dejavu = "2.37"

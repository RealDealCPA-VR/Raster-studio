[workspace]
resolver = "2"
members = [
  "apps/studio-desktop",
  "crates/app-shell",
  "crates/design",
  "crates/ui",
  "crates/editor-core",
  "crates/layer-model",
  "crates/render",
  "crates/render-shaders",
  "crates/raster",
  "crates/tools",
  "crates/adjustments",
  "crates/project-format",
  "crates/asset-store",
  "crates/color",
  "crates/compositor",
  "crates/filters",
  "crates/selection",
  "crates/vector",
  "crates/psd",
  "crates/text-engine",
  "crates/telemetry",
  "tests/integration",
]

[workspace.package]
edition = "2021"
rust-version = "1.89"
license = "Proprietary"
authors = ["Raster Studio"]
repository = "https://github.com/RealDealCPA-VR/Raster-studio"

# NOTE on rust-version (the MSRV):
# 1.89 is the highest `rust-version` any package in Cargo.lock declares
# (cosmic-text 0.17 and smol_str 0.3 at the time of writing), so nothing
# older can build this lockfile. CI's `msrv` job runs `cargo +1.89 check`
# to keep this number honest; the everyday toolchain is pinned in
# rust-toolchain.toml. The edition stays 2021: nothing here needs 2024.

[workspace.dependencies]
# Error handling
anyhow = "1"
thiserror = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
postcard = { version = "1", features = ["use-std"] }

# Identity / hashing
uuid = { version = "1", features = ["v4", "serde"] }
blake3 = "1"

# Async / concurrency
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "net", "time", "fs"] }
rayon = "1"
crossbeam-channel = "0.5"

# URL opening (Help destinations)
webbrowser = "1"

# Math
glam = { version = "0.29", features = ["serde"] }

# Graphics / windowing
winit = "0.30"
wgpu = "22"
egui = "0.29"
egui-wgpu = "0.29"
egui-winit = { version = "0.29", features = ["accesskit"] }
accesskit_winit = "0.22"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
raw-window-handle = "0.6"

# Compression (PSD ZIP channel encoding)
flate2 = "1"

# Image codecs
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff"] }

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }

# File watching
notify = "6"

# Diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Crypto (update signatures)
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"

# Internal crates
app-shell        = { path = "crates/app-shell" }
design           = { path = "crates/design" }
ui               = { path = "crates/ui" }
editor-core      = { path = "crates/editor-core" }
layer-model      = { path = "crates/layer-model" }
render           = { path = "crates/render" }
render-shaders   = { path = "crates/render-shaders" }
raster           = { path = "crates/raster" }
tools            = { path = "crates/tools" }
adjustments      = { path = "crates/adjustments" }
project-format   = { path = "crates/project-format" }
asset-store      = { path = "crates/asset-store" }
color            = { path = "crates/color" }
compositor       = { path = "crates/compositor" }
filters          = { path = "crates/filters" }
selection        = { path = "crates/selection" }
vector           = { path = "crates/vector" }
psd              = { path = "crates/psd" }
text-engine      = { path = "crates/text-engine" }
telemetry        = { path = "crates/telemetry" }

[profile.dev]
opt-level = 1          # keep image/GPU work bearable in debug

[profile.dev.package."*"]
opt-level = 3          # optimize deps even in dev builds

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

kortix_version = 1

[project]
name = "RealDealCPA"
description = "A Machine project."

[env]
required = []
optional = [ "ANTHROPIC_API_KEY", "OPENAI_API_KEY", "AGNES_API_KEY" ]

[opencode]
config_dir = ".kortix/opencode"

[[triggers]]
slug = "memory-reflector"
name = "Memory reflector"
type = "cron"
agent = "memory-reflector"
enabled = false
cron = "0 0 3 * * *"
timezone = "UTC"
prompt = "Load the `kortix-memory` skill, then reflect on the last 24h of\nproject activity (git log, merged CRs). Update `.kortix/memory/` per\nthe rubric and open a single CR titled `memory: …`. Exit silently if\nnothing is worth changing.\n"

[[connectors]]
slug = "anthropic"
provider = "pipedream"
credential = "shared"
app = "anthropic"
account = "default"

[[apps]]
slug = "test-site"
name = "test-site-7"
enabled = true
domains = []

[apps.source]
type = "git"
repo = "https://github.com/templatecookie/poco-html"
branch = "master"
